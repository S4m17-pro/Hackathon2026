services:
  mysql:
    image: mysql:8.0
    container_name: supervision-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: supervision
      MYSQL_USER: supervision
      MYSQL_PASSWORD: supervision
    volumes:
      - supervision_mysql_data:/var/lib/mysql
      # Permisos para la shadow database de Prisma. Sin esto,
      # `npm run db:migrate` falla con P3014 porque el usuario `supervision`
      # solo tiene derechos sobre `supervision` y no puede crear la base
      # temporal que Prisma usa para detectar drift.
      # Solo corre la primera vez, cuando el volumen se crea.
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-usupervision",
          "-psupervision",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  supervision_mysql_data: